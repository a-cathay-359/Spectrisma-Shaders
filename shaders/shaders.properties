# Spectrisma Shaders (SS) - 界面布局
#
# 【关键】选项本身不写在这里！选项是着色器里的 #define
#   （见 include/ss_settings.glsl 与 final.fsh 顶部）
# 这个文件只负责：菜单怎么摆、哪些选项做成滑块、预设按钮。
#
# 原写法 option.PRESET=0 是无效的，Iris 完全不认，会导致面板空白。

name=Spectrisma Shaders

# 原版方块日月：贴图已置空，但 Iris 仍会画那块方框，所以统一关掉。
# 【注意】这行不能包在 #ifdef SS_ENABLE_ROUND_SUN 里 —— Iris 的 properties 预处理器
# 只认用户选项宏，SS_ENABLE_ROUND_SUN 是从 PRESET 推出来的派生宏，包进去等于不生效。
sun=false
moon=false

version=v1.7.4
author=Spectrisma Team
description=模块化分层性能光影，一影通吃，纯视觉不干涉服务器逻辑

# 主菜单：完整恢复 v1.6.8 的排布（不加品牌行、不加留白行、顶部不堆分区按钮）
#   <profile> 一键预设 | PRESET 预设 | FILTER 滤镜 | 三个滑块 | 云层 | 阴影子屏
screen = <empty> <profile> <empty> PRESET FILTER <empty> EXPOSURE SATURATION CONTRAST <empty> CLOUDS CLOUD_STYLE [SHADOWS]

screen.columns = 2

# 阴影子屏
screen.SHADOWS = shadowMapResolution shadowDistance
screen.SHADOWS.columns = 2

# 只有列在这里的选项才显示成滑块，其余非布尔选项都是"点击循环"按钮
sliders = EXPOSURE SATURATION CONTRAST

# ===== 一键预设（点 <profile> 按钮切换）=====
# profile 名会直接显示在"配置文件"那一栏，Iris 用窄等宽字体画，
# 中文会叠成乱码 —— 所以这里必须 ASCII（中文说明放 lang 的 profile.comment）
profile.germinated = PRESET:0
profile.potato     = PRESET:1
profile.low        = PRESET:2
profile.medium     = PRESET:3
profile.high       = PRESET:4
